# Production Postgres settings, sized for an 8 GB VM shared with the apps. Mounted over the default config.
listen_addresses = '*'          # only reachable on the Docker network; nothing publishes 5432
max_connections = 100
shared_buffers = 2GB
effective_cache_size = 5GB
work_mem = 16MB
maintenance_work_mem = 256MB
log_min_duration_statement = 500
timezone = 'UTC'
include '/etc/postgresql/backup.conf'
